name: Fieldnote EAS Build

# Runs an EAS cloud build that produces a phone-installable Android APK and a
# public Expo install page (tap-to-install, no GitHub login). This runs on a
# GitHub runner rather than locally because EAS needs network access to Expo's
# servers, which the authoring sandbox can't reach.
#
# Trigger manually (Actions tab -> Fieldnote EAS Build -> Run workflow), or via
# the API. Requires an EXPO_TOKEN repository secret — create one at
# https://expo.dev/settings/access-tokens and add it under
# Settings -> Secrets and variables -> Actions.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (preview = installable APK)'
        required: false
        default: 'preview'
  # Tag trigger so the build can be kicked off from a feature branch before the
  # PR merges (workflow_dispatch only works from the default branch). Pushing a
  # tag like `eas-build-1` runs this workflow at that commit.
  push:
    tags:
      - 'eas-build-*'

defaults:
  run:
    working-directory: fieldnote

jobs:
  eas-android:
    name: EAS Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify EXPO_TOKEN is set
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions (name: EXPO_TOKEN)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fieldnote/package-lock.json

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Creates (or links) a real EAS project under the token's account and
      # writes its projectId into app.json for this run. Needed because the
      # committed app.json intentionally carries no projectId.
      - name: Initialize EAS project
        run: eas init --non-interactive --force

      # --wait blocks until the cloud build finishes; the install-page URL and
      # the direct .apk artifact URL are printed in this step's log. Profile
      # defaults to preview when triggered by a tag (no workflow inputs then).
      - name: Build Android APK on EAS
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          PROFILE="${PROFILE:-preview}"
          echo "Building with EAS profile: $PROFILE"
          eas build --platform android --profile "$PROFILE" --non-interactive --wait

name: Publish vault release

# Reassembles the split Unified_Vault parts on the CI runner and publishes the
# single .zip as a Release asset, so it can be downloaded with one click (no
# local reassembly). Runs when the parts change on this branch, or on demand.
on:
  push:
    branches: [claude/new-session-JMgv1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vault-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble vault zip
        run: |
          set -euo pipefail
          cat Unified_Vault_2026-05-23.zip.part* > Unified_Vault_2026-05-23.zip
          ls -lh Unified_Vault_2026-05-23.zip
          unzip -t Unified_Vault_2026-05-23.zip >/dev/null && echo "zip integrity OK"

      - name: Publish (or refresh) the Release in place
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=vault-2026-05-23
          # Upload-in-place: never delete the release/tag (so the download link
          # never 404s). Create the release once if missing, then clobber the asset.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Unified Vault 2026-05-23" \
              --notes "Single-file build of the unified Obsidian vault, reassembled by CI from the in-repo split parts. Download \`Unified_Vault_2026-05-23.zip\`, unzip, and open \"✦ My Vault ✦\" in Obsidian."
          fi
          gh release upload "$TAG" Unified_Vault_2026-05-23.zip --clobber
          echo "Asset URL:"
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/Unified_Vault_2026-05-23.zip"

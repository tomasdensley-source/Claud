name: Fieldnote Build

on:
  push:
    paths:
      - 'fieldnote/**'
      - '.github/workflows/fieldnote-build.yml'
  pull_request:
    paths:
      - 'fieldnote/**'
      - '.github/workflows/fieldnote-build.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: fieldnote

jobs:
  test:
    name: Type-check & smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fieldnote/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run smoke tests
        run: npm test

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fieldnote/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install

      # Build a RELEASE APK, not debug: a debug RN/Expo APK expects a Metro
      # dev server at launch and won't run standalone on a phone. The release
      # variant embeds the JS bundle and is signed with the debug.keystore
      # that `expo prebuild` generates (release signingConfig = debug in the
      # template), so it installs and runs on any device with no extra
      # secrets. Minify/ProGuard stays off (Expo default), avoiding
      # missing-rule crashes. This mirrors what `eas build --profile preview`
      # produces (internal-distribution APK), without needing an Expo account.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        working-directory: fieldnote/android

      - name: Rename APK
        run: cp fieldnote/android/app/build/outputs/apk/release/app-release.apk fieldnote-1.5.0.apk
        working-directory: .

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldnote-android-apk
          path: fieldnote-1.5.0.apk
          if-no-files-found: error
